#
# Custom hardened CRS tuning for this project.
# This file is included BEFORE CRS setup/rules.
#
# Notes:
# - Increase paranoia level for stricter detection/blocking.
# - Set anomaly thresholds for blocking decisions.
#

# Paranoia level (1-4). 2 is a good "hardened" baseline while still practical.
SecAction "id:900110,phase:1,pass,nolog,setvar:tx.paranoia_level=2"

# Anomaly scoring thresholds (lower => stricter blocking)
SecAction "id:900120,phase:1,pass,nolog,setvar:tx.inbound_anomaly_score_threshold=5"
SecAction "id:900130,phase:1,pass,nolog,setvar:tx.outbound_anomaly_score_threshold=4"

# Keep audit log noise reasonable while still capturing blocks
SecAction "id:900140,phase:1,pass,nolog,setvar:tx.auditlog_parts=+E"

