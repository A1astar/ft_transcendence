# Engine and baseline
SecRuleEngine On
SecStatusEngine Off
SecComponentSignature "transcendence WAF (ModSecurity v3)"

# Performance and limits
SecPcreMatchLimit 15000
SecPcreMatchLimitRecursion 15000
SecArgumentsLimit 200

# Directories and file modes
SecTmpDir /tmp
SecDataDir /var/cache/modsecurity
SecAuditLogDirMode 0770
SecAuditLogFileMode 0640

# Logging and audit
SecAuditEngine RelevantOnly
SecAuditLogType Serial
SecAuditLogFormat JSON
SecAuditLog /dev/stdout
SecAuditLogParts ABIJDEFHZ
SecAuditLogRelevantStatus "^(?:5|4(?!04))\\d{2}$"
SecDebugLog /dev/null
SecDebugLogLevel 0

# Request body handling
SecRequestBodyAccess On
SecRequestBodyLimit 10485760
SecRequestBodyNoFilesLimit 131072
SecRequestBodyLimitAction Reject
SecRequestBodyJsonDepthLimit 10

# Response body handling
SecResponseBodyAccess Off
SecResponseBodyLimit 1048576
SecResponseBodyLimitAction ProcessPartial
SecResponseBodyMimeTypesClear
SecResponseBodyMimeType text/html text/plain text/xml application/json application/javascript