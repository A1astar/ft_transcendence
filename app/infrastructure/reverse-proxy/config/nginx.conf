load_module /usr/lib/nginx/modules/ngx_http_modsecurity_module.so;

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Map for correct Connection header on WebSocket upgrades
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Disable access logs (enable for troubleshooting)
    access_log off;

    server {
        listen 80;
        server_name localhost;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        ssl_certificate /etc/nginx/certs/self.crt;
        ssl_certificate_key /etc/nginx/certs/self.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        # --- Baseline security headers ---
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        # Adjust CSP as needed for your SPA assets
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://cdn.babylonjs.com; connect-src 'self' https: wss:;" always;

        # Serve frontend files (SPA support)
        location /{
            try_files $uri $uri/ /index.html;
        }

        # Game Engine (WebSockets) - enable ModSecurity (handshake inspection)
        location /api/game-engine/ {
            modsecurity on;
            modsecurity_rules_file /etc/nginx/modsec/main.conf;

            proxy_pass http://game-engine:3003/api/game-engine/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 60s;
            proxy_buffering off;
        }

        # OAuth callback: allow flow, log only
        location = /api/auth/oauth/google/callback {
            modsecurity on;
            modsecurity_rules "SecRuleEngine DetectionOnly";
            proxy_pass http://gateway:3000/api/auth/oauth/google/callback;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Game Orchestration: log only to avoid CRS false positives
        location /api/game-orchestration/ {
            modsecurity on;
            modsecurity_rules_file /etc/nginx/modsec/main.conf;
            proxy_pass http://gateway:3000/api/game-orchestration/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API Gateway (REST) - enable ModSecurity + CRS
        location /api/ {
            modsecurity on;
            modsecurity_rules_file /etc/nginx/modsec/main.conf;

            proxy_pass http://gateway:3000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
