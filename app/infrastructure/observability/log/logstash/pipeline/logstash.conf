input {
  gelf {
    host => "0.0.0.0"
    port => 12201
  }
  # beats { port => 5044 }
}

filter {
  # Normalize GELF fields
  if ![message] and [short_message] {
    mutate { rename => { "short_message" => "message" } }
  }
  mutate { add_field => { "service" => "%{tag}" } }
  if ![service] or [service] == "" {
    mutate { replace => { "service" => "%{container_name}" } }
  }

  # Redactions
  if [message] =~ /Authorization/i {
    mutate { gsub => ["message", "(Authorization\\s*:\\s*)\\S+", "\\1[REDACTED]"] }
  }
  if [message] =~ /Cookie/i {
    mutate { gsub => ["message", "(Cookie\\s*:\\s*.*?session[^;]*=)[^;\\s]+", "\\1[REDACTED]"] }
  }

  # Parse JSON application logs
  if [message] =~ "^{.*}$" {
    json { source => "message" target => "event" }
    if [event][level]     { mutate { rename => { "[event][level]" => "[log][level]" } } }
    if [event][msg]       { mutate { rename => { "[event][msg]"   => "message" } } }
    if [event][timestamp] {
      date {
        match  => ["[event][timestamp]", "ISO8601", "UNIX", "UNIX_MS"]
        target => "@timestamp"
      }
    }
    if [event][req] {
      if [event][req][method] { mutate { rename => { "[event][req][method]" => "[http][request][method]" } } }
      if [event][req][url]    { mutate { rename => { "[event][req][url]"    => "[url][original]" } } }
      if [event][req][id]     { mutate { rename => { "[event][req][id]"     => "[trace][id]" } } }
    }
    if [event][res] and [event][res][statusCode] {
      mutate { rename => { "[event][res][statusCode]" => "[http][response][status_code]" } }
    }
  }

  # Nginx access (combined)
  if [service] == "reverse-proxy" and [message] !~ "^{.*}$" and [message] =~ /HTTP\/\d\.\d\"/ {
    grok {
      match => {
        "message" => '%{IPORHOST:source.address} - %{DATA:remote_user} \[%{HTTPDATE:nginx.time}\] "%{WORD:[http][request][method]} %{DATA:[url][original]} HTTP/%{NUMBER:http.version}" %{NUMBER:[http][response][status_code]:int} %{NUMBER:body.bytes:int} "%{DATA:http.referrer}" "%{DATA:user_agent}"'
      }
      tag_on_failure => []
    }
    date {
      match        => ["[nginx][time]", "dd/MMM/yyyy:HH:mm:ss Z"]
      target       => "@timestamp"
      remove_field => ["[nginx][time]"]
    }
  }

  # Nginx error
  if [service] == "reverse-proxy" and [message] =~ /\[(error|warn|info|crit|alert)\]/ {
    grok {
      match => {
        "message" => '%{YEAR}/%{MONTHNUM}/%{MONTHDAY} %{TIME:nginx.err_time} \[%{LOGLEVEL:log.level}\] %{NUMBER:nginx.err_pid}(?:#%{NUMBER:nginx.err_tid})?: \*%{NUMBER:nginx.conn} %{GREEDYDATA:nginx.err_msg}'
      }
      tag_on_failure => []
    }
    date {
      match        => ["[nginx][err_time]", "yyyy/MM/dd HH:mm:ss"]
      target       => "@timestamp"
      remove_field => ["[nginx][err_time]"]
    }
  }

  # ModSecurity audit (basic extraction)
  if [service] == "reverse-proxy" and [message] =~ /ModSecurity:/ {
    grok {
      match => {
        "message" => 'ModSecurity: %{GREEDYDATA:modsec.msg} \[id "%{DATA:modsec.id}"\](?: \[severity "%{DATA:modsec.severity}"\])?(?: \[data "%{DATA:modsec.data}"\])?'
      }
      tag_on_failure => []
    }
  }

  # Vault logs (fallback)
  if [service] == "hashicorp-vault" and [message] !~ "^{.*}$" {
    grok {
      match => { "message" => '%{TIMESTAMP_ISO8601:vault.time} \[%{LOGLEVEL:log.level}\] %{GREEDYDATA:vault.msg}' }
      tag_on_failure => []
    }
    date { match => ["[vault][time]", "ISO8601"] target => "@timestamp" remove_field => ["[vault][time]"] }
    mutate { replace => { "message" => "%{[vault][msg]}" } }
  }

  # Node services: morgan combined
  if [service] in ["gateway","authentication","game-orchestration","game-engine"] and [message] !~ "^{.*}$" and [message] =~ /HTTP\/\d\.\d\"/ {
    grok {
      match => { "message" => "%{COMBINEDAPACHELOG}" }
      tag_on_failure => []
    }
    mutate {
      rename => {
        "verb"     => "[http][request][method]"
        "response" => "[http][response][status_code]"
        "bytes"    => "body.bytes"
        "request"  => "[url][original]"
      }
    }
  }

  # Drop noisy health checks
  if [url][original] and [url][original] =~ /^\/(health|metrics|favicon\.ico)$/ {
    drop { }
  }

  mutate {
    convert => {
      "[http][response][status_code]" => "integer"
      "body.bytes"                    => "integer"
    }
  }
}

output {
  elasticsearch {
    hosts              => ["${ELASTIC_HOST:http://elasticsearch:9200}"]
    user               => "${ELASTIC_USER:elastic}"
    password           => "${ELASTIC_PASSWORD:changeme}"
    ilm_enabled        => true
    ilm_rollover_alias => "logs-microservices"
    ilm_pattern        => "000001"
    ilm_policy         => "logs_policy"
    manage_template    => false
    ecs_compatibility  => v1
  }
  stdout { codec => rubydebug }
}
