name: transcendence
services:
  reverse-proxy:
    build:
        context: ../
        dockerfile: infrastructure/reverse-proxy/Dockerfile
    ports:
      - "8080:80"
      - "8443:443"
    networks:
      - microservices-network
    volumes:
      - ../infrastructure/reverse-proxy/certs:/etc/nginx/certs:ro
    depends_on:
      - gateway
    logging:
      driver: gelf
      options:
        gelf-address: "udp://127.0.0.1:12201"
        tag: "reverse-proxy"
    restart: unless-stopped

  gateway:
    build: ../services/gateway
    ports:
      - "3000"
    networks:
      - microservices-network
    depends_on:
      - authentication
      - game-orchestration
      - game-engine
    logging:
      driver: gelf
      options:
        gelf-address: "udp://127.0.0.1:12201"
        tag: "gateway"
    restart: unless-stopped

  authentication:
    build: ../services/authentication
    ports:
      - "3001"
    networks:
      - microservices-network
      - vault-network
    volumes:
      - ../infrastructure/hcp-vault/certs/ca.crt:/etc/ssl/vault/ca.crt:ro
      - ../infrastructure/hcp-vault/secrets:/run/secrets:ro
    environment:
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_CALLBACK_URL=https://localhost:8443/api/auth/oauth/google/callback
      - VAULT_ADDR=https://hashicorp-vault:8200
      - NODE_EXTRA_CA_CERTS=/etc/ssl/vault/ca.crt
    depends_on:
      - hashicorp-vault
    logging:
      driver: gelf
      options:
        gelf-address: "udp://127.0.0.1:12201"
        tag: "authentication"
    restart: unless-stopped

  hashicorp-vault:
    build: ../infrastructure/hcp-vault
    user: "${UID}:${GID}"
    ports:
      - "8200:8200"
    networks:
      - vault-network
    volumes:
      - vault-data:/vault/data
      - vault-keys:/vault/keys
      - ../infrastructure/hcp-vault/certs:/vault/certs:ro
      - ../infrastructure/hcp-vault/secrets:/vault/secrets
    environment:
      - VAULT_ADDR=https://127.0.0.1:8200
      - VAULT_CACERT=/vault/certs/ca.crt
    restart: unless-stopped

  game-orchestration:
    build: ../services/game-orchestration
    ports:
      - "3002"
    networks:
      - microservices-network
    environment:
      - GAME_ENGINE_HOST=game-engine
      - GAME_ENGINE_PORT=3003
    logging:
      driver: gelf
      options:
        gelf-address: "udp://127.0.0.1:12201"
        tag: "game-orchestration"
    restart: unless-stopped

  game-engine:
    build: ../services/game-engine
    ports:
      - "3003"
    networks:
      - microservices-network
    logging:
      driver: gelf
      options:
        gelf-address: "udp://127.0.0.1:12201"
        tag: "game-engine"
    restart: unless-stopped

  prometheus:
    build: ../infrastructure/observability/metric/prometheus
    networks:
      - microservices-network
    ports:
      - "9090:9090"
    volumes:
      - ../infrastructure/observability/metric/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  grafana:
    build: ../infrastructure/observability/metric/graphana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-admin}
    networks:
      - microservices-network
    ports:
      - "3005:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  elasticsearch:
    build: ../infrastructure/observability/log/elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - xpack.security.enabled=true
    ports:
      - "9200:9200"
    volumes:
      - ../infrastructure/observability/log/elasticsearch/data:/usr/share/elasticsearch/data
    networks:
      - microservices-network

  logstash:
    build: ../infrastructure/observability/log/logstash
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
      - ELASTIC_HOST=http://elasticsearch:9200
      - ELASTIC_USER=elastic
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
    volumes:
      - ../infrastructure/observability/log/logstash/pipeline:/usr/share/logstash/pipeline
      - ../infrastructure/observability/log/logstash/config:/usr/share/logstash/config
    depends_on:
      - elasticsearch
    ports:
      - "12201:12201/udp"   # GELF input from Docker logging driver
      - "5044:5044"         # Beats (optional)
      - "9600:9600"         # Monitoring API
    networks:
      - microservices-network

  kibana:
    build: ../infrastructure/observability/log/kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=${ELASTIC_PASSWORD}
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - microservices-network

networks:
  microservices-network:
    driver: bridge

  vault-network:
    driver: bridge

volumes:
  vault-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../infrastructure/hcp-vault/data

  vault-keys:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../infrastructure/hcp-vault/keys